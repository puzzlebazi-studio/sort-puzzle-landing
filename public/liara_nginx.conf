# Liara's static platform includes this file in its nginx server block, in place of its default,
# which answers every unknown address with /index.html (here, the redirect to /fa/).

gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 6;
gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# Every page is a folder with an index.html; any other address is a missing page.
location / {
  index index.html;
  try_files $uri $uri/ =404;
}

error_page 404 /404.html;

location ~ /\.well-known {
  allow all;
}

# Pages always check for a new version.
location ~* \.html$ {
  expires -1;
}

# The build names these files by their contents, so they never change.
location ^~ /assets/ {
  expires 1y;
}

# Fonts, icons, badges and share images keep their names.
location ~* \.(?:woff2|svg|png|jpe?g|webp|ico)$ {
  expires 30d;
}
